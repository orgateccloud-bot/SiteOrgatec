<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Revisão técnica · ORGATEC</title>
<link rel="stylesheet" href="../painel/base.css">
<style>
  body { margin: 0; padding: 24px 16px; font-family: Inter, system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; display: grid; gap: 16px; }
  .linha { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 14px 16px; border-radius: 14px;
    background: var(--vidro, rgba(255,255,255,.06)); border: 1px solid var(--borda, rgba(255,255,255,.12)); }
  .tipo { font: 600 12px/1 "JetBrains Mono", monospace; text-transform: uppercase; opacity: .7; }
  textarea, input, select { font: inherit; padding: 6px 8px; border-radius: 8px; }
  textarea { width: 100%; min-height: 36px; margin-top: 8px; }
  .topo { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
  details pre { white-space: pre-wrap; font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Revisão técnica</h1>
    <p>Uso interno, fora do site. Cada decisão fica presa ao texto revisado (hash do conteúdo). O registro é baixado em JSON e conferido com <code>python tools/conferir_revisao.py arquivo.json</code>. Nada é enviado pela rede.</p>
  </header>
  <section class="topo">
    <label>Responsável técnico<br><input id="responsavel" autocomplete="off"></label>
    <label>Data<br><input id="data" type="date"></label>
    <label>Mostrar<br><select id="filtro"><option value="">Tudo</option><option>Ponto</option><option>Pergunta</option><option>Peso por perfil</option></select></label>
    <button type="button" id="baixar">Gerar registro (.json)</button>
    <span id="resumo"></span>
  </section>
  <section id="lista"></section>
</main>
<script src="../../site/assets/js/fontes.js"></script>
<script src="../../site/assets/js/conteudo.js"></script>
<script src="../../site/assets/js/reforma-itens.js"></script>
<script src="../../site/assets/js/compliance-itens.js"></script>
<script src="../../site/assets/js/termometro.js"></script>
<script src="revisao.js"></script>
<script src="revisao-tela.js"></script>
</body>
</html>
