[project]
name = "orgatec-central-transporte"
version = "0.1.0"
description = "Central de Viagem do módulo de Transporte (ORGATEC) — previsão de despesas, tempo, bloqueios, clima e telemetria."
authors = [{ name = "Warley Moreira Veloso" }]
requires-python = ">=3.11"
# Versões mínimas conferidas no ambiente de desenvolvimento em 09/11/2026 (pip).
dependencies = [
  "fastapi>=0.162",
  "sqlalchemy>=2.1",
  "httpx>=0.28",
  "pydantic>=2.13",
  "pydantic-settings>=2.16",
  "cryptography>=50.0",
  "alembic>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "ruff>=0.16", "bandit>=1.8"]
postgres = ["psycopg[binary]>=3.2"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
