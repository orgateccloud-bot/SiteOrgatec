name: Boletim da Janela de Campo (protótipo)

# PROTÓTIPO: gera o boletim num runner limpo e guarda o resultado como artefato. NÃO publica, NÃO tem agendamento
# e NÃO usa credencial do Google. O boletim de verdade segue nas tarefas do Windows (ORGATEC\JanelaCampo05h/11h/17h).
# Estudo e plano de ativação: docs/ideias/boletim-no-actions.md

on:
  workflow_dispatch:
  push:
    branches: [ideia/boletim-actions]   # só para testar enquanto o arquivo não está na main; sai antes de ativar
    paths:
      - .github/workflows/boletim-campo-prototipo.yml
      - tools/restaurar_dados_do_site.py
      - tools/gerar_boletim_campo.py
      - tools/cartao_campo.py

concurrency:
  group: boletim-campo-prototipo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Dependências do gerador
        run: pip install httpx defusedxml Pillow playwright
      - name: Navegador para o cartão do status
        run: python -m playwright install --with-deps chromium

      - name: Restaurar o histórico que está no ar
        run: python tools/restaurar_dados_do_site.py

      - name: Gerar o boletim (sem publicar)
        run: python tools/gerar_boletim_campo.py

      - name: Conferir o resultado
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          d = pathlib.Path("site/dados/campo")
          atual = json.loads((d / "atual.json").read_text(encoding="utf-8"))
          indice = json.loads((d / "indice.json").read_text(encoding="utf-8"))["boletins"]
          cartao = d / "cartao-status.png"
          linhas = [
              "### Boletim da Janela de Campo (protótipo, não publicado)",
              f"- Dia: **{atual['dia']}**, gerado às {atual.get('geradoEm')}",
              f"- Polos: {len(atual.get('polos', []))}",
              f"- Boletins no índice: {len(indice)}",
              f"- Cartão do status: {'sim' if cartao.exists() else 'NÃO gerado'}",
          ]
          pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(linhas) + "\n", encoding="utf-8")
          print("\n".join(linhas))
          if not cartao.exists() or len(indice) < 2:
              sys.exit("resultado incompleto: cartão ausente ou histórico não restaurado")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: boletim-campo-${{ github.run_id }}
          path: site/dados
          retention-days: 7
          if-no-files-found: error
