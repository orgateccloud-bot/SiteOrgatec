name: Testes

on:
  push:
    branches: [main, desenvolvimento]
  pull_request:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --test tests/js/*.test.js
      - run: python -m bandit -q -r backend tools
      - name: Falhas conhecidas nas dependências da API
        run: pip install pip-audit && pip-audit -r backend/requirements-prod.txt --no-deps --disable-pip
      - run: python -m pytest tests/py tests/e2e -q -p no:cacheprovider
