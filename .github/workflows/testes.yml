name: Testes

on:
  push:
    branches: [main, desenvolvimento]
  pull_request:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Navegador para os testes e2e
        timeout-minutes: 12
        run: |
          # O apt do runner às vezes não resolve o DNS do espelho do Ubuntu; tenta 3 vezes, atualizando o índice entre elas.
          for tentativa in 1 2 3; do
            python -m playwright install --with-deps chromium && exit 0
            echo "::warning::instalação do Chromium falhou (tentativa $tentativa); tentando de novo"
            sleep $((tentativa * 20))
            sudo apt-get update -o Acquire::Retries=3 || true
          done
          exit 1
      - run: node --test tests/js/*.test.js
      - run: python -m bandit -q -r backend tools
      - name: Falhas conhecidas nas dependências da API
        run: pip install pip-audit && pip-audit -r backend/requirements-prod.txt --no-deps --disable-pip
      - run: python -m pytest tests/py tests/e2e -q -p no:cacheprovider
